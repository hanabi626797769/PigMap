<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>群友地图</title>

    <!-- Leaflet 地图库 -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f5f5;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        h1 {
            margin: 12px 16px 8px;
            font-size: 32px;
            line-height: 1.2;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            z-index: 500;
            position: relative;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 16px 8px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(15, 23, 42, 0.12);
            border-radius: 999px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            z-index: 500;
            position: relative;
        }

        .search-bar input {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            font-size: 14px;
            line-height: 1.4;
            outline: none;
            color: #1f2937;
        }

        .search-bar button {
            border: none;
            background: #f59e0b;
            color: #fff;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .search-status {
            margin: 0 16px 10px;
            min-height: 18px;
            font-size: 12px;
            color: #475569;
            z-index: 500;
            position: relative;
        }

        /* 地图占据整个屏幕 */
        #map {
            flex: 1;
            width: 100%;
            min-height: 0;
        }

        .pig-marker {
            background: transparent;
            border: none;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-4px);
        }

        .pig-marker img {
            width: 24px;
            height: 24px;
            display: block;
            object-fit: contain;
            pointer-events: none;
        }

        .title-pig {
            font-size: 28px;
            line-height: 1;
            display: inline-block;
        }
    </style>
</head>

<body>

    <h1>
        <span class="title-pig" aria-label="pig">🐷</span>
        群友地图
    </h1>

    <div class="search-bar" aria-label="地址搜索">
        <input
            id="search-input"
            type="text"
            placeholder="搜索城市、地址或地点"
            aria-label="搜索城市、地址或地点"
        />
        <button id="search-button" type="button">搜索</button>
    </div>

    <div id="search-status" class="search-status" aria-live="polite"></div>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        // =====================================================
        // 1. 创建地图
        // =====================================================

        const map = L.map('map', {
            crs: L.CRS.EPSG3857,
            continuousWorld: true,
            worldCopyJump: false,
            noWrap: true,
            minZoom: 1,
            maxZoom: 12,
            zoomSnap: 0.25,
            zoomDelta: 0.5,
            bounceAtZoomLimits: false,
            inertia: true,
            fadeAnimation: false
        }).setView(
            [15, 0],
            2.2
        );


        // =====================================================
        // 2. 加入 OpenStreetMap
        // =====================================================

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '© OpenStreetMap contributors',
                noWrap: true
            }
        ).addTo(map);


        // =====================================================
        // 3. 保存所有正式猪的数据
        // =====================================================

        let pigMarkers = {};

        // 用来生成每只猪的唯一 ID
        let pigIdCounter = 0;

        const STORAGE_KEY = 'pig_map_markers_v1';
        const COUNTER_KEY = 'pig_map_counter_v1';

        function savePigData() {
            try {
                const data = Object.keys(pigMarkers).map((pigId) => ({
                    id: pigId,
                    lat: pigMarkers[pigId].lat,
                    lng: pigMarkers[pigId].lng,
                    pigName: pigMarkers[pigId].pigName,
                    location: pigMarkers[pigId].location,
                    nearby: pigMarkers[pigId].nearby,
                    status: pigMarkers[pigId].status
                }));

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(data)
                );

                localStorage.setItem(
                    COUNTER_KEY,
                    String(pigIdCounter)
                );

                return true;
            } catch (error) {
                console.error('保存猪地图数据失败：', error);
                return false;
            }
        }

        function clearAllPigMarkers() {
            Object.keys(pigMarkers).forEach((pigId) => {
                const pig = pigMarkers[pigId];

                if (pig && pig.marker) {
                    map.removeLayer(pig.marker);
                }
            });

            pigMarkers = {};
        }

        function loadPigData() {
            const saved = localStorage.getItem(STORAGE_KEY);

            if (!saved) {
                return;
            }

            try {
                const data = JSON.parse(saved);

                if (!Array.isArray(data)) {
                    return;
                }

                clearAllPigMarkers();

                data.forEach((pig) => {
                    const pigId = pig.id || 'pig_' + pigIdCounter++;

                    if (!pigMarkers[pigId]) {
                        createPigMarker(
                            pig.lat,
                            pig.lng,
                            pig.pigName,
                            pig.location,
                            pig.nearby,
                            pig.status,
                            pigId,
                            false
                        );
                    }
                });

                const savedCounter = Number(
                    localStorage.getItem(COUNTER_KEY)
                );

                if (!Number.isNaN(savedCounter)) {
                    pigIdCounter = Math.max(
                        pigIdCounter,
                        savedCounter
                    );
                }
            } catch (error) {
                console.warn('读取猪地图数据失败：', error);
            }
        }


        // =====================================================
        // 4. 创建一只正式的猪
        // =====================================================

        function createPigMarker(
            lat,
            lng,
            pigName,
            location,
            nearby,
            status,
            fixedPigId = null,
            shouldPersist = true
        ) {

            // 创建唯一 ID
            let pigId = fixedPigId || 'pig_' + pigIdCounter++;


            // 创建自定义猪图标
            let pigIcon = createPigIcon();

            // 创建 Marker
            let marker = L.marker([lat, lng], {
                icon: pigIcon
            })
                .addTo(map);


            // 保存猪的信息
            pigMarkers[pigId] = {

                marker: marker,

                lat: lat,
                lng: lng,

                pigName: pigName,
                location: location,
                nearby: nearby,
                status: status

            };


            // 设置 Popup
            updatePigPopup(pigId);

            if (shouldPersist) {
                savePigData();
            }

            return marker;
        }


        // =====================================================
        // 5. 更新猪的 Popup
        // =====================================================

        function updatePigPopup(pigId) {

            let pig = pigMarkers[pigId];


            pig.marker.bindPopup(`

                <b>🐷 ${pig.pigName}</b><br>

                🌍 ${pig.location}<br>

                📍 ${pig.nearby}<br>

                📊 状态：${pig.status}<br>

                <br>

                纬度：${pig.lat.toFixed(4)}<br>

                经度：${pig.lng.toFixed(4)}<br>

                <br>

                <button onclick="editPig('${pigId}')">
                    ✏️ 修改猪信息
                </button>

                <button onclick="deletePig('${pigId}')">
                    🗑️ 删除猪点位
                </button>

            `);
        }


        // =====================================================
        // 6. 初始化默认猪
        // =====================================================

        const storedPigCount = localStorage.getItem(STORAGE_KEY);
        if (!storedPigCount) {
            createPigMarker(
                35.6762,
                139.6503,
                '东京猪',
                '🇯🇵 日本 · 东京',
                '东京市中心',
                '正在生活'
            );

            createPigMarker(
                48.8584,
                2.2945,
                '巴黎猪',
                '🇫🇷 法国 · 巴黎',
                '埃菲尔铁塔附近',
                '正在旅行'
            );

            savePigData();
        } else {
            loadPigData();
        }

        window.addEventListener('storage', function (event) {
            if (event.key === STORAGE_KEY || event.key === COUNTER_KEY) {
                loadPigData();
            }
        });


        // =====================================================
        // 8. 临时猪
        // =====================================================

            return L.divIcon({
                html: `<img src="${pigImage}" alt="pig">`,
                className: 'pig-marker',
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
        }

        let pendingLatLng = null;

        let pendingMarker = null;

        function resetPendingState() {
            if (pendingMarker) {
                try {
                    map.removeLayer(pendingMarker);
                } catch (error) {
                    console.warn('清理临时猪失败：', error);
                }
            }

            pendingMarker = null;
            pendingLatLng = null;
        }

        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const searchStatus = document.getElementById('search-status');

        function showSearchStatus(message, isError = false) {
            searchStatus.textContent = message;
            searchStatus.style.color = isError ? '#b91c1c' : '#475569';
        }

        function clearSearchResultMarker() {
            if (pendingMarker) {
                map.removeLayer(pendingMarker);
                pendingMarker = null;
            }

            pendingLatLng = null;
        }

        async function searchAddress() {
            const query = (searchInput.value || '').trim();

            if (!query) {
                showSearchStatus('请输入要搜索的地址或城市。', true);
                searchInput.focus();
                return;
            }

            showSearchStatus('搜索中…');

            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(query)}`,
                    {
                        headers: {
                            'Accept-Language': 'zh-CN,zh;q=0.9'
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error('搜索服务暂时不可用');
                }

                const results = await response.json();

                if (!Array.isArray(results) || results.length === 0) {
                    throw new Error('没有找到匹配地点');
                }

                const place = results[0];
                const lat = Number(place.lat);
                const lng = Number(place.lon);

                resetPendingState();
                pendingLatLng = { lat, lng };

                pendingMarker = L.marker([lat, lng], {
                    icon: createPigIcon()
                })
                    .addTo(map)
                    .bindPopup(`
                        <b>📍 ${place.display_name}</b><br>
                        <br>
                        纬度：${lat.toFixed(4)}<br>
                        经度：${lng.toFixed(4)}
                        <br><br>
                        <button onclick="confirmPig()">
                            ✅ 确认位置
                        </button>
                        <button onclick="cancelPig()">
                            ❌ 取消
                        </button>
                    `)
                    .openPopup();

                map.flyTo([lat, lng], Math.max(map.getZoom(), 5), {
                    duration: 1.4
                });

                showSearchStatus(`已定位：${place.display_name}`);
            } catch (error) {
                console.error(error);
                showSearchStatus(error.message || '搜索失败，请稍后再试。', true);
            }
        }

        searchButton.addEventListener('click', searchAddress);
        searchInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                searchAddress();
            }
        });

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                resetPendingState();
            }
        });

        window.addEventListener('pageshow', function () {
            resetPendingState();
            loadPigData();
        });


        // =====================================================
        // 9. 点击地图
        // =====================================================

        map.on('click', function(e) {


            // -------------------------------------------------
            // 重要：
            // 如果点击的是 Popup 内部
            // 不执行“创建临时猪”
            // -------------------------------------------------

            if (
                e.originalEvent.target.closest(
                    '.leaflet-popup'
                )
            ) {

                return;

            }


            // -------------------------------------------------
            // 删除之前的临时猪
            // -------------------------------------------------

            if (pendingMarker) {

                map.removeLayer(
                    pendingMarker
                );

            }


            // -------------------------------------------------
            // 保存当前点击的位置
            // -------------------------------------------------

            pendingLatLng = e.latlng;


            // -------------------------------------------------
            // 创建临时猪
            // -------------------------------------------------

            pendingMarker = L.marker(
                pendingLatLng,
                {
                    icon: createPigIcon()
                }
            )
                .addTo(map)
                .bindPopup(`

                    <b>🐷 是否在这里放置一只猪？</b><br>

                    纬度：
                    ${pendingLatLng.lat.toFixed(4)}<br>

                    经度：
                    ${pendingLatLng.lng.toFixed(4)}

                    <br><br>

                    <button onclick="confirmPig()">
                        ✅ 确认位置
                    </button>

                    <button onclick="cancelPig()">
                        ❌ 取消
                    </button>

                `)
                .openPopup();

        });


        // =====================================================
        // 10. 确认位置
        // =====================================================

        function confirmPig() {

            if (!pendingMarker || !pendingLatLng) {
                showSearchStatus('当前没有可确认的位置，请重新选点或搜索。', true);
                return;
            }

            // -------------------------------------------------
            // 输入猪名字
            // -------------------------------------------------

            let pigName = prompt(
                '🐷 给这只猪取个名字：'
            );


            if (!pigName) {

                return;

            }


            // -------------------------------------------------
            // 输入国家 / 城市
            // -------------------------------------------------

            let location = prompt(
                '🌍 国家 / 城市：'
            );


            if (!location) {

                return;

            }


            // -------------------------------------------------
            // 输入附近地点
            // -------------------------------------------------

            let nearby = prompt(
                '📍 XX附近：'
            );


            if (!nearby) {

                return;

            }


            // -------------------------------------------------
            // 输入状态
            // -------------------------------------------------

            let status = prompt(
                '📊 状态：'
            );


            if (!status) {

                return;

            }


            // -------------------------------------------------
            // 保存坐标
            // -------------------------------------------------

            let lat = pendingLatLng.lat;

            let lng = pendingLatLng.lng;


            // -------------------------------------------------
            // 创建唯一 ID
            // -------------------------------------------------

            let pigId = 'pig_' + pigIdCounter++;


            // -------------------------------------------------
            // 保存这只猪
            // -------------------------------------------------

            pigMarkers[pigId] = {

                marker: pendingMarker,

                lat: lat,
                lng: lng,

                pigName: pigName,
                location: location,
                nearby: nearby,
                status: status

            };

            savePigData();


            // -------------------------------------------------
            // 更新 Popup
            // -------------------------------------------------

            updatePigPopup(
                pigId
            );


            // -------------------------------------------------
            // 打开正式 Popup
            // -------------------------------------------------

            pendingMarker.openPopup();


            // -------------------------------------------------
            // 清除临时状态
            // -------------------------------------------------

            pendingMarker = null;

            pendingLatLng = null;


            // -------------------------------------------------
            // 添加完成提示
            // -------------------------------------------------

            alert(
                '🐷 猪添加完毕！'
            );

        }


        // =====================================================
        // 11. 修改猪的信息
        // =====================================================

        function editPig(pigId) {


            let pig = pigMarkers[pigId];


            // -------------------------------------------------
            // 修改名字
            // -------------------------------------------------

            let pigName = prompt(
                '🐷 修改猪的名字：',
                pig.pigName
            );


            if (pigName === null) {

                return;

            }


            // -------------------------------------------------
            // 修改国家 / 城市
            // -------------------------------------------------

            let location = prompt(
                '🌍 修改国家 / 城市：',
                pig.location
            );


            if (location === null) {

                return;

            }


            // -------------------------------------------------
            // 修改附近地点
            // -------------------------------------------------

            let nearby = prompt(
                '📍 修改 XX附近：',
                pig.nearby
            );


            if (nearby === null) {

                return;

            }


            // -------------------------------------------------
            // 修改状态
            // -------------------------------------------------

            let status = prompt(
                '📊 修改状态：',
                pig.status
            );


            if (status === null) {

                return;

            }


            // -------------------------------------------------
            // 保存修改
            // -------------------------------------------------

            pig.pigName = pigName;

            pig.location = location;

            pig.nearby = nearby;

            pig.status = status;

            savePigData();


            // -------------------------------------------------
            // 更新 Popup
            // -------------------------------------------------

            updatePigPopup(
                pigId
            );


            // -------------------------------------------------
            // 重新打开 Popup
            // -------------------------------------------------

            pig.marker.openPopup();

        }


        // =====================================================
        // 12. 删除猪
        // =====================================================

        function deletePig(pigId) {


            // -------------------------------------------------
            // 二次确认
            // -------------------------------------------------

            let result = confirm(
                '确定要删除这只猪吗？'
            );


            if (!result) {

                return;

            }


            // -------------------------------------------------
            // 找到这只猪
            // -------------------------------------------------

            let pig = pigMarkers[pigId];


            if (pig) {


                // 从地图删除
                map.removeLayer(
                    pig.marker
                );


                // 从数据中删除
                delete pigMarkers[pigId];

                savePigData();

            }

        }


        // =====================================================
        // 13. 取消添加临时猪
        // =====================================================

        function cancelPig() {
            resetPendingState();
        }


    </script>
